<div class="converter">

<h1>Binary Converter</h1>

<p>

Convert Binary and Decimal numbers instantly.

</p>

<label>

Binary Number

</label>

<input
id="binary"
placeholder="Example: 101101">

<button onclick="binaryToDecimal()">

Convert to Decimal

</button>

<br><br>

<label>

Decimal Number

</label>

<input
id="decimal"
placeholder="Example: 45">

<button onclick="decimalToBinary()">

Convert to Binary

</button>

<div class="result">

<h2 id="output">

Result will appear here

</h2>

</div>

</div>
